<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form>
    <table border="1" cellpadding="10" cellspacing="0" style="border-color: rgb(207, 205, 205);">
        <head >
            <th colspan="2">Summer Camp Registration Form</th>
        </head>

        <body>
            <tr align="right">
                <td>
                    <label for="fullName">Full Name</label>
                </td>
                <td align="left">
                    <input type="text" name="fullName" id="fullName" placeholder="Enter First Name" required>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <label for="dop" required>Date of Birth</label>
                </td>
                <td>
                    <input type="date" name="dob" id="dob" max="2005-12-31">
                </td>
            </tr>       
            <tr>
                <td align="right">
                    <label for="gender">Gender</label>
                </td>
                <td>
                    <div>
                        <input type="radio" name="gender" id="gender_male">
                        <label for="gender_male">Male</label>
                        <input type="radio" name="gender" id="gender_female">
                        <label for="gender_female">Female</label>
                    </div>
                </td>
            </tr>       
            <tr>
                <td align="right">
                    <label for="country">Country</label>
                </td>
                <td>
                    <select name="country" id="country" required>
                        <option value="" disabled selected>Country</option>
                        <option value="palestine">Palestine</option>
                        <option value="lebanon">Lebanon</option>
                        <option value="yemen">Yemen</option>
                    </select>
                </td>
            </tr>    
            <tr>
                <td align="right">
                    <label for="email">E-mail</label>
                </td>
                <td>
                    <input type="email" name="email" id="email" required>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <label for="phone">Phone</label>
                </td>
                <td>
                    <input type="tel" name="phone" id="phone" placeholder="Enter Phone" max="999999999" min="0000000000" required>
                </td>
            </tr>            
            <tr>
                <td align="right">
                    <label for="password">Password</label>

                </td>
                <td>
                    <input type="password" name="password" id="password" min="8" required>
                </td>
            </tr>            
            <tr>
                <td align="right">
                    <label for="conf_password">Confirm Password</label>
                </td>
                <td>
                    <input type="password" name="conf_password" id="conf_password" required>
                </td>
            </tr>  
            <tr>
                <td align="right">
                    <label for="gpa">GPA (100)</label>
                </td>
                <td>
                    <input type="number" name="gpa" id="gpa" placeholder="92.5" min="0" max="100" step="0.1" required> 
                </td>
            </tr>  
            <tr>
                <td align="right">
                    <label for="programming_skills">Programmings skills (0-100)</label>
                </td>
                <td>
                    <input type="range" name="programming_skills" id="programming_skills" required> 
                </td>
            </tr>  
            <tr>
                <td align="right">
                    <label for="fav_color" >Your favorite color</label>
                </td>
                <td>
                    <input type="color" name="fav_color" id="fav_color">
                </td>
            </tr>  
            <tr>
                <td></td>
                <td>
                    <input type="checkbox" name="yes" id="yes" required>
                    <label for="yes">I Agree to the Terms of use</label>
                </td>
            </tr>  
        </body>

        <footer>
            <td colspan="2" align="right">
                <input type="submit" value="Send My Application">
                <input type="reset" value="Clear All">
            </td>
        </footer>

    </table>
    </form>
</body>

</html>
