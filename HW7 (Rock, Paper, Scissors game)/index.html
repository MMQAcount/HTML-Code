<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="header_container">
            <img src="./images/logo.svg" alt="triangle">
            <div class="score_container">
                <h3>SCORE</h3>
                <h1 id="score"></h1>
            </div>
        </div>
        <div class="play_container">
            <div class="paper_scissor">
                <button id="paper" style="border-color: #4c69f3;" onclick="on_choose('paper')"><img src="./images/icon-paper.svg" alt="paper"></button>
                <button id="scissor" onclick="on_choose('scissor')"><img src="./images/icon-scissors.svg" alt="scissors"></button>
            </div>
            <button id="rock" class="brown_button btn-5" onclick="on_choose('rock')"><img src="./images/icon-rock.svg" alt="rock"></button>
        </div>
    </div>
    <button class="rules_button" id="rules_button" onclick="show_rules()">RULES</button>
    <div id="overlay"> 
        <div class="rules_part">
            <div class="close_rules">
                <h1>Rules</h1>
                <button id="hide_rules" onclick="hide_rules()">X</button>
            </div>
            <img src="./images/image-rules.svg" alt="roles" width="80%" height="80%">
        </div>
    </div>
</body>
</html>
